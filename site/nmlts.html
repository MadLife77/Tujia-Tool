<body oncontextmenu="return false" onselectstart="return false">
    <div class="container">
        <header>
            <div class="logo">💬</div>
            <h1>匿名聊天室</h1>
            <p class="subtitle">安全<span class="dot-sep"></span>私密<span class="dot-sep"></span>无需注册</p>
        </header>

        <div class="toolbar">
            <div class="status-bar">
                <span style="color: var(--text-secondary); font-size: 13px; font-weight: 500;">防封入口/任选其一进入</span>
                <span class="status-separator"></span>
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">正在检测延迟...</span>
            </div>
            <button class="btn-retest spinning" id="btnRetest" disabled onclick="retestAll()">
                <span class="icon-refresh">↻</span> 重新测速
            </button>
        </div>

        <div class="server-list" id="serverList">
        </div>

        <div class="footer">
            <p>所有连接均加密传输 · 保护你的隐私安全</p>
        </div>
    </div>
    <script>
        const servers = [
            'https://nmlts.caozhilou.cn',
            'https://nmlts.dpdns.org',
            'https://nmlts.412291.xyz',
            'https://nmlts.0147258.xyz',
            'https://nmlts.zone.id',
            'https://z.nmlts.qd.je',
            'https://nmlts.lovie.me',
        ].map(url => ({
            host: url.replace(/^https?:\/\//, ''),
            url: url
        }));

        const latencyResults = {};
        let testingInProgress = false;
        let testAbortControllers = [];

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnRetest = document.getElementById('btnRetest');
        const serverList = document.getElementById('serverList');

        function classifyLatency(ms) {
            if (ms < 0) return 'unreachable';
            const s = ms / 1000;
            if (s < 3) return 'fast';
            if (s < 5) return 'medium';
            if (s < 10) return 'slow';
            return 'very-slow';
        }

        function formatLatency(ms) {
            if (ms < 0) return '超时';
            return (ms / 1000).toFixed(2) + 's';
        }

        function buildServerHTML(server, index, testing) {
            const result = latencyResults[server.url];
            const hasResult = result !== undefined;
            const cls = hasResult ? classifyLatency(result) : 'testing';
            const display = testing ? '检测中...' : (hasResult ? formatLatency(result) : '检测中...');

            return `
                <a href="${server.url}" class="server-item" rel="noopener">
                    <div class="server-info">
                        <h3>${server.host}</h3>
                    </div>
                    <div class="server-right">
                        <span class="latency-badge ${cls}" id="latency-${index}">
                            ${testing ? '' : '<span class="latency-dot"></span>'}
                            ${display}
                        </span>
                        <span class="connect-btn" id="connectBtn-${index}">
                            进入
                            <span class="arrow">→</span>
                        </span>
                    </div>
                </a>
            `;
        }

        function renderAll(testing) {
            serverList.innerHTML = servers.map((s, i) => buildServerHTML(s, i, testing)).join('');
        }

        async function testSingleLatency(url, timeoutMs = 8000) {
            const controller = new AbortController();
            testAbortControllers.push(controller);
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const start = performance.now();
                await fetch(url, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal,
                    cache: 'no-cache',
                    redirect: 'follow',
                    keepalive: false
                });
                const end = performance.now();
                clearTimeout(timeoutId);
                return Math.round(end - start);
            } catch (e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') {
                    return -1;
                }

                try {
                    const start = performance.now();
                    await fetch(url, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-cache',
                        redirect: 'follow',
                        keepalive: false
                    });
                    const end = performance.now();
                    return Math.round(end - start);
                } catch (e2) {
                    return -1;
                }
            }
        }

        async function testAllLatencies() {
            if (testingInProgress) return;
            testingInProgress = true;
            testAbortControllers = [];

            statusDot.className = 'status-dot testing';
            statusText.textContent = '正在检测延迟...';
            btnRetest.classList.add('spinning');
            btnRetest.disabled = true;

            renderAll(true);

            const promises = servers.map(async (server, i) => {
                const result = await testSingleLatency(server.url);
                latencyResults[server.url] = result;

                const serverItems = serverList.querySelectorAll('.server-item');
                const item = serverItems[i];

                if (result < 0 && item) {
                    // 超时立即隐藏
                    item.style.display = 'none';
                } else {
                    const badge = document.getElementById('latency-' + i);
                    if (badge) {
                        const cls = classifyLatency(result);
                        badge.className = 'latency-badge ' + cls;
                        badge.innerHTML = '<span class="latency-dot"></span>' + formatLatency(result);
                    }
                }

                return result;
            });

            await Promise.all(promises);

            markBestServer();

            const reachable = Object.values(latencyResults).filter(v => v >= 0);
            if (reachable.length > 0) {
                const minLatency = Math.min(...reachable);
                statusDot.className = 'status-dot done';
                statusText.textContent = `最快 ${(minLatency / 1000).toFixed(2)}s`;
            } else {
                statusDot.className = 'status-dot';
                statusDot.style.background = 'var(--red)';
                statusText.textContent = '所有入口均无法连接';
            }

            btnRetest.classList.remove('spinning');
            btnRetest.disabled = false;
            testingInProgress = false;
        }

        function markBestServer() {
            const results = servers.map(s => ({
                url: s.url,
                latency: latencyResults[s.url]
            }));
            const reachable = results.filter(r => r.latency >= 0);

            document.querySelectorAll('.connect-btn.best').forEach(el => el.classList.remove('best'));
            document.querySelectorAll('.best-tag').forEach(el => el.remove());
            document.querySelectorAll('.server-label .best-tag').forEach(el => el.remove());

            if (reachable.length === 0) return;

            reachable.sort((a, b) => a.latency - b.latency);
            const bestUrl = reachable[0].url;
            const bestIndex = servers.findIndex(s => s.url === bestUrl);

            if (bestIndex >= 0) {
                const connectBtn = document.getElementById('connectBtn-' + bestIndex);
                if (connectBtn) {
                    connectBtn.classList.add('best');
                }

                const serverItems = serverList.querySelectorAll('.server-item');
                const targetItem = serverItems[bestIndex];
                if (targetItem) {
                    const label = targetItem.querySelector('.server-label');
                    if (label) {
                        const tag = document.createElement('span');
                        tag.className = 'best-tag';
                        tag.textContent = '⚡ 最快';
                        label.appendChild(tag);
                    }
                }
            }
        }

        function retestAll() {
            if (testingInProgress) return;
            for (const key in latencyResults) {
                delete latencyResults[key];
            }
            // 重新测速前先显示所有服务器
            const serverItems = serverList.querySelectorAll('.server-item');
            serverItems.forEach(item => { item.style.display = ''; });
            testAllLatencies();
        }

        renderAll(true);
        testAllLatencies();
    </script>
</body>
</html>
