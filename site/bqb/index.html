        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }

        @keyframes pulse {
            0% {

            50% {

            100% {
                opacity: 0.3;

            pointer-events: none;

            height: 5px;

            border-radius: 50%;

        .fullscreen-image.zoomed {

        .close-btn:active {

        .zoom-info {
            position: fixed;

        .zoom-info.visible {

        /* 文字提取结果弹窗样式 */
        #textResultModal {
            position: fixed;
            top: 50%;

        #textResultContent {

        #textResultModal .button-group {

        #textResultOverlay {

            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
